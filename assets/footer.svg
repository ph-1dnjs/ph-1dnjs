<svg xmlns="http://www.w3.org/2000/svg" width="800" height="64" viewBox="0 0 800 64" role="img" aria-label="THANKS FOR SCROLLING  ///  SEE YOU IN THE NEXT COMMIT  ///  UNA"><style>
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.35) rotate(90deg)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nudge{animation:nudge 1.6s steps(4) infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
.scan{animation:scan 5.5s linear infinite}
@keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(var(--h))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="1.2" height="1.2" fill="#ececec" fill-opacity=".09"/></pattern></defs><rect width="800" height="64" rx="6" fill="#0c0c0c"/><rect width="800" height="64" rx="6" fill="url(#dots)"/><g><rect x="10" y="17" width="780" height="30" fill="#ececec"/><clipPath id="tk17"><rect x="10" y="17" width="780" height="30"/></clipPath><g clip-path="url(#tk17)"><text x="10" y="36.0" font-size="11" font-weight="700" textLength="1386" lengthAdjust="spacing" fill="#0c0c0c" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','Apple SD Gothic Neo','Malgun Gothic',monospace" style="animation:mq17 18s linear infinite">THANKS FOR SCROLLING  ///  SEE YOU IN THE NEXT COMMIT  ///  UNA  ///  THANKS FOR SCROLLING  ///  SEE YOU IN THE NEXT COMMIT  ///  UNA  ///  THANKS FOR SCROLLING  ///  SEE YOU IN THE NEXT COMMIT  ///  UNA  ///  </text></g><style>@keyframes mq17{to{transform:translateX(-462px)}}</style></g><rect x="10.5" y="10.5" width="779" height="43" fill="none" stroke="#ececec" stroke-opacity=".18"/><g class="scan" style="--h:124px"><rect x="0" y="0" width="800" height="60" fill="#ececec" fill-opacity=".025"/><rect x="0" y="59" width="800" height="1" fill="#ececec" fill-opacity=".12"/></g></svg>