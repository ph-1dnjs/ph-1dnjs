<svg xmlns="http://www.w3.org/2000/svg" width="260" height="460" viewBox="0 0 260 460" role="img" aria-label="interacta — A NEW EXPERIMENT IN PROGRESS."><style>
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.35) rotate(90deg)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nudge{animation:nudge 1.6s steps(4) infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
.scan{animation:scan 5.5s linear infinite}
@keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(var(--h))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.flip{animation:flip 3s steps(1) infinite}
@keyframes flip{0%,49%,64%,100%{opacity:1}50%,63%{opacity:0}}
.rip{animation:rip 2.2s steps(2) infinite}
@keyframes rip{0%,100%{opacity:1}50%{opacity:.15}}
.look{animation:look 6s steps(1) infinite}
@keyframes look{0%,100%{transform:none}20%{transform:translate(12px,-6px)}45%{transform:translate(-12px,4px)}70%{transform:translate(0,16px)}}
.lid{animation:lid 6s ease-in-out infinite}
@keyframes lid{0%,46%,52%,100%{transform:scaleY(1)}49%{transform:scaleY(.06)}}
.go{animation:nudge 1.4s steps(3) infinite}
.fresh{transform-origin:left;animation:fresh 2.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes fresh{from{transform:scaleX(0)}}
