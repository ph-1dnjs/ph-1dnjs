<svg xmlns="http://www.w3.org/2000/svg" width="800" height="265" viewBox="0 0 800 265" role="img" aria-label="Hi, I'm Una.">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f5f5"/><stop offset="1" stop-color="#e8e8e8"/></linearGradient></defs>
  <rect x="1" y="1" width="798" height="263" rx="24" fill="url(#bg)" stroke="#e3e3e3"/>
  <circle cx="718" cy="51" r="102" fill="#fff" opacity=".35"/><circle cx="742" cy="210" r="75" fill="#fff" opacity=".22"/>
