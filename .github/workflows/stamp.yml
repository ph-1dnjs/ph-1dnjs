name: Pixel party stamp
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: profile-write
  cancel-in-progress: false
jobs:
  stamp:
    if: startsWith(github.event.issue.title, 'stamp:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record stamp
        id: stamp
        env:
          STAMP_TITLE: ${{ github.event.issue.title }}
          STAMP_LOGIN: ${{ github.event.issue.user.login }}
        run: python scripts/stamp.py
      - name: Commit wall
        if: steps.stamp.outputs.result == 'accepted'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stamps.json assets/stamps.svg
          git commit -m "Pixel party: ${{ steps.stamp.outputs.kind }} stamp"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.stamp.outputs.result }}
        run: |
          if [ "$RESULT" = "accepted" ]; then
            MSG="✦ 스탬프가 찍혔어요! 프로필로 돌아가면 PIXEL PARTY 벽에서 확인할 수 있어요. 들러줘서 고마워요 :)"
          else
            MSG="스탬프 형식을 인식하지 못했어요. 프로필의 버튼을 눌러 다시 시도해 주세요."
          fi
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$MSG"
